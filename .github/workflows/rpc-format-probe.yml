name: rpc-format-probe

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    if: github.head_ref == 'feature/mycelium-base-rpc-pqc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format only new RPC files
        run: |
          set -euxo pipefail
          rustfmt --version
          rustfmt --edition 2021 crates/mycelium-rpc/src/lib.rs
          rustfmt --edition 2021 crates/mycelium-node/src/rpc_gateway.rs
          echo '=== RPC_FORMAT_DIFF_BEGIN ==='
          git diff -- crates/mycelium-rpc/src/lib.rs crates/mycelium-node/src/rpc_gateway.rs
          echo '=== RPC_FORMAT_DIFF_END ==='
          test -z "$(git diff --name-only -- crates/mycelium-rpc/src/lib.rs crates/mycelium-node/src/rpc_gateway.rs)"
