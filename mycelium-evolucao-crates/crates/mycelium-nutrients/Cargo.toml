[package]
name = "mycelium-nutrients"
description = "Nutrient Cycling: a economia bioquímica do substrato"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mycelium-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = { workspace = true }
mycelium-zkp = { workspace = true, features = ["bolt11"], optional = true }

[features]
default = []
# Validação BOLT11 (Lightning) no resgate de voucher: exige invoice válido.
bolt11 = ["dep:mycelium-zkp"]
