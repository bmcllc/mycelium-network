[package]
name = "mycelium-zkp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Primitivas ZK/cripto nativas: HashChronicle, Pedersen, GhostIdentity, hashcash + (features) Bulletproofs range-proof, VOID-00 license (ML-DSA-87), BOLT11 Lightning invoices."

[features]
default = []
range-proof = ["dep:bulletproofs", "dep:merlin", "dep:curve25519-dalek-ng"]
license   = ["dep:ml-dsa"]
bolt11    = ["dep:lightning-invoice"]

[[example]]
name = "gen_license"
required-features = ["license"]

[dependencies]
blake3 = { workspace = true }
sha3 = { version = "0.10" }
hex = { workspace = true }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
serde = { workspace = true }

# Phase A — range-proof (void_core lock: bulletproofs =4.0.0, merlin =3.0.0, dalek-ng =4.1.1)
bulletproofs = { version = "=4.0.0", optional = true }
merlin = { version = "=3.0.0", optional = true }
curve25519-dalek-ng = { version = "=4.1.1", optional = true }

# Phase B — VOID-00 license + device binding (void_core lock: ml-dsa =0.1.0)
ml-dsa = { version = "=0.1.0", optional = true }

# Phase B — BOLT11 invoice parsing (void_core lock: lightning-invoice =0.33.2)
lightning-invoice = { version = "=0.33.2", optional = true }
