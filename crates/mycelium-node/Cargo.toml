[package]
name = "mycelium-node"
description = "Organismo do nó: daemon persistente, protocolo Lattice e controle local"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mycelium-core = { workspace = true }
mycelium-hyphae = { workspace = true }
mycelium-pheromones = { workspace = true }
mycelium-nutrients = { workspace = true }
mycelium-ghostid = { workspace = true }
mycelium-sporebank = { workspace = true }
mycelium-tropical = { workspace = true }
mycelium-store = { workspace = true }
giggs = { workspace = true }
thefield = { workspace = true }
inertia = { workspace = true }
vacuum = { workspace = true }
singularity = { workspace = true }
isotope = { workspace = true }
entropy = { workspace = true }
plasma = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
libp2p = { workspace = true }
axum = { workspace = true }
base64 = "0.22"
mycelium-zkp = { workspace = true, features = ["license", "bolt11"], optional = true }
mycelium-veil = { workspace = true, optional = true }
mycelium-pqc = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
reqwest = { workspace = true }
axum = { workspace = true }

[features]
default = []
veil = ["dep:mycelium-veil", "dep:mycelium-pqc"]
webrtc = ["mycelium-hyphae/webrtc"]
license = ["dep:mycelium-zkp", "mycelium-hyphae/license"]
# Lightning BOLT11 no runtime (parse/validação de invoice para a economia voucher).
bolt11 = ["dep:mycelium-zkp", "mycelium-zkp/bolt11", "mycelium-nutrients/bolt11"]
# Mantido para a CLI activar a mesma feature flag; publish Nostr corre no CLI.
nostr = []
nostr-transport = ["mycelium-hyphae/nostr-transport"]
